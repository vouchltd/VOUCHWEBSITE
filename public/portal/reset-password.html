<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set Your Password — Vouch SoCal</title>
<meta name="description" content="Set or reset your Vouch SoCal client portal password.">
<link rel="icon" type="image/png" href="../brand_assets/favicon.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  @font-face {
    font-family: 'Inter';
    src: url('../Inter/Inter-VariableFont_opsz,wght.ttf') format('truetype');
    font-weight: 100 900; font-style: normal; font-display: swap;
  }
  :root { color-scheme: light; }
  body { background: #1F3A2E; font-family: 'Inter', sans-serif; min-height: 100vh; }
  .card {
    max-width: 420px; margin: 0 auto; background: #FCFBF7; border-radius: 16px;
    padding: 32px; box-shadow: 0 4px 24px rgba(0,0,0,0.18);
  }
  .field { margin-bottom: 18px; }
  .label { display: block; color: #5C6B60; font-size: 13px; font-weight: 600; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.06em; }
  .input {
    display: block; width: 100%; border: 1px solid #D9DFDA; border-radius: 8px;
    padding: 12px 14px; font-size: 15px; background: #FFFFFF; color: #1B2620;
    font-family: inherit;
  }
  .input:focus { outline: none; border: 2px solid #2E4B3F; padding: 11px 13px; }
  .submit {
    width: 100%; padding: 14px; border-radius: 8px; border: none; cursor: pointer;
    margin-top: 8px; font-size: 15px; font-weight: 700; background: #CF9640; color: #3D2A08;
    font-family: inherit;
  }
  .submit:hover:not(:disabled) { background: #B8822F; }
  .submit:disabled { opacity: 0.6; cursor: not-allowed; }
  .msg-error { color: #A6432E; font-size: 13px; margin-top: 12px; text-align: center; }
  .msg-info { color: #2E4B3F; font-size: 13px; margin-top: 12px; text-align: center; }
  button:focus-visible, input:focus-visible { outline: 2px solid #CF9640; outline-offset: 2px; }
</style>
</head>
<body class="antialiased flex items-center justify-center px-6 py-16">
  <main class="w-full">
    <div class="text-center mb-8">
      <a href="../" class="inline-flex items-center gap-2.5">
        <img src="../brand_assets/logo-mark.png" alt="Vouch SoCal" class="h-14 w-auto object-contain">
        <span class="font-semibold text-2xl tracking-tight text-white">Vouch SoCal</span>
      </a>
      <p class="text-white/80 text-sm mt-2">Client Portal</p>
    </div>

    <div class="card">
      <h1 class="text-xl font-semibold text-[#1B2620] mb-1" id="heading">Set your password</h1>
      <p class="text-sm text-[#5C6B60] mb-6" id="subheading">Choose a password for your portal account.</p>

      <form id="reset-form" novalidate>
        <div class="field">
          <label class="label" for="password">New Password</label>
          <input class="input" type="password" id="password" required minlength="8" autocomplete="new-password">
        </div>
        <div class="field">
          <label class="label" for="password2">Confirm Password</label>
          <input class="input" type="password" id="password2" required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="submit" id="submit-btn">Set Password</button>
        <p class="msg-error hidden" id="error-msg" role="alert" aria-live="assertive"></p>
        <p class="msg-info hidden" id="info-msg" role="status" aria-live="polite"></p>
      </form>
    </div>

    <p class="text-center text-white/40 text-[0.7rem] mt-8">Vouch SoCal is a subsidiary of Lens and Ladder. Vouch SoCal is owned, operated, and overseen by Lens and Ladder.</p>
  </main>

  <script src="supabase-client.js"></script>
  <script>
    const form = document.getElementById('reset-form');
    const errorMsg = document.getElementById('error-msg');
    const infoMsg = document.getElementById('info-msg');
    const submitBtn = document.getElementById('submit-btn');

    // supabase-js automatically parses the recovery token from the URL hash
    // (detectSessionInUrl defaults to true) and establishes a session.
    (async () => {
      const session = await vouchGetSession();
      if (!session) {
        document.getElementById('heading').textContent = 'Link expired';
        document.getElementById('subheading').textContent = 'This password link is invalid or has expired. Request a new one from the login page.';
        form.classList.add('hidden');
      }
    })();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.add('hidden');
      infoMsg.classList.add('hidden');

      const p1 = document.getElementById('password').value;
      const p2 = document.getElementById('password2').value;
      if (p1.length < 8) {
        errorMsg.textContent = 'Password must be at least 8 characters.';
        errorMsg.classList.remove('hidden');
        return;
      }
      if (p1 !== p2) {
        errorMsg.textContent = 'Passwords do not match.';
        errorMsg.classList.remove('hidden');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Saving...';

      const { error } = await sb.auth.updateUser({ password: p1 });
      if (error) {
        errorMsg.textContent = 'Could not set password: ' + error.message;
        errorMsg.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Set Password';
        return;
      }

      infoMsg.textContent = 'Password set. Redirecting to login...';
      infoMsg.classList.remove('hidden');
      const role = await vouchGetRole((await vouchGetSession()).user.id);
      setTimeout(() => {
        window.location.href = role === 'admin' ? 'admin' : 'dashboard';
      }, 1200);
    });
  </script>
</body>
</html>
